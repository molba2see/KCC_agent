<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="64" y="88" font-family="Apple SD Gothic Neo, sans-serif" font-size="38" fill="#152238">파일 라이프사이클 에이전트 · 실행 구조</text><text x="64" y="127" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" fill="#536277">에이전트는 다음 행동을 선택합니다. 실행기는 허용 범위와 근거를 검증합니다.</text><rect x="570" y="165" width="480" height="112" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="592" y="209" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">01  입력과 목표</text><text x="592" y="246" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">허용된 파일 · 프로젝트 · 사용자 요청</text><rect x="570" y="325" width="480" height="145" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="592" y="369" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">02  상태와 컨텍스트</text><text x="592" y="406" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">자료 ID · 관찰 결과 · 출처</text><text x="592" y="437" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">프로젝트 상태 · 보존 정책</text><rect x="570" y="525" width="480" height="145" rx="16" fill="white" stroke="#7750b6" stroke-width="3"/><text x="592" y="569" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#7750b6">03  Controller</text><text x="592" y="606" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">고정 / 규칙 / 모델을 같은 도구로 비교</text><text x="592" y="637" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">탐색 · 질문 · 계획 · 종료 선택</text><rect x="570" y="725" width="480" height="145" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="592" y="769" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">04  Tool Gateway</text><text x="592" y="806" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">인자 스키마 · 허용 ID · 반복/예산 검사</text><text x="592" y="837" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">검증을 통과한 호출만 실행</text><rect x="64" y="520" width="420" height="180" rx="16" fill="white" stroke="#187e71" stroke-width="3"/><text x="86" y="564" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#187e71">도구와 처리 라우터</text><text x="86" y="601" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">텍스트/PDF/OCR · 프로젝트 검색</text><text x="86" y="632" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">관련 파일 · 명시적 참조 검사</text><text x="86" y="663" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">도구 결과를 관찰로 되돌림</text><rect x="1120" y="520" width="416" height="150" rx="16" fill="white" stroke="#b37b22" stroke-width="3"/><text x="1142" y="564" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#b37b22">모호하면 질문 후 대기</text><text x="1142" y="601" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">귀속 · 유지 의사 확인</text><text x="1142" y="632" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">답변을 상태에 반영한 뒤 재개</text><rect x="1120" y="725" width="416" height="150" rx="16" fill="white" stroke="#187e71" stroke-width="3"/><text x="1142" y="769" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#187e71">계획 → 승인된 실행기</text><text x="1142" y="806" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">실행 직전 상태·해시·참조 재검증</text><text x="1142" y="837" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">이동 · 저널 · undo</text><rect x="64" y="935" width="1472" height="125" rx="16" fill="white" stroke="#536277" stroke-width="3"/><text x="86" y="979" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#536277">공통 실행 기록 · 평가</text><text x="86" y="1016" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">도구/인자/관찰 · 짧은 결정 근거 · 지연 · 토큰 · 오류 · 계획과 실제 실행 결과</text><text x="86" y="1047" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">비공개 사고 과정은 수집하지 않습니다. 원문·정답·운영 설정은 공개 저장소에 넣지 않습니다.</text><polyline points="810,277 810,325" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="810,325 801,310 819,310" fill="#7788a0"/><polyline points="810,470 810,518" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="810,518 801,503 819,503" fill="#7788a0"/><polyline points="810,670 810,718" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="810,718 801,703 819,703" fill="#7788a0"/><polyline points="570,795 520,795 520,610 484,610" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="484,610 499,601 499,619" fill="#7788a0"/><polyline points="274,520 274,395 570,395" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="570,395 555,386 555,404" fill="#7788a0"/><polyline points="1050,600 1120,600" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="1120,600 1105,591 1105,609" fill="#7788a0"/><polyline points="1050,800 1120,800" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="1120,800 1105,791 1105,809" fill="#7788a0"/></svg>