<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><rect width="100%" height="100%" fill="#f7f9fc"/><text x="64" y="88" font-family="Apple SD Gothic Neo, sans-serif" font-size="38" fill="#152238">개발 · 평가 · 배포의 진행 구조</text><text x="64" y="127" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" fill="#536277">모델 학습은 첫 단계가 아닙니다. 관찰된 실패 원인에 맞춰 필요한 부분만 개선합니다.</text><rect x="64" y="190" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="86" y="234" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">1  명세</text><text x="86" y="271" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">목표 · 입력/출력 · 금지 행동</text><polyline points="524,275 564,275" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="564,275 549,266 549,284" fill="#7788a0"/><rect x="564" y="190" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="586" y="234" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">2  컨텍스트</text><text x="586" y="271" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">시스템 프롬프트 · 근거 · 작업 메모리</text><polyline points="1024,275 1064,275" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="1064,275 1049,266 1049,284" fill="#7788a0"/><rect x="1064" y="190" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="1086" y="234" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">3  도구 계약</text><text x="1086" y="271" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">타입 스키마 · 라우팅 · 권한</text><rect x="64" y="440" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="86" y="484" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">4  실행 제어</text><text x="86" y="521" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">모델 선택 · 상태 · 종료 · 오류 처리</text><polyline points="524,525 564,525" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="564,525 549,516 549,534" fill="#7788a0"/><rect x="564" y="440" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="586" y="484" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">5  평가</text><text x="586" y="521" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">성공 · 근거 · 호출 · 질문 · 비용</text><polyline points="1024,525 1064,525" fill="none" stroke="#7788a0" stroke-width="4"/><polygon points="1064,525 1049,516 1049,534" fill="#7788a0"/><rect x="1064" y="440" width="460" height="170" rx="16" fill="white" stroke="#3267c8" stroke-width="3"/><text x="1086" y="484" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#3267c8">6  관찰과 개선</text><text x="1086" y="521" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">실패 분류 → 프롬프트/검색/학습 선택</text><rect x="64" y="730" width="1472" height="140" rx="16" fill="white" stroke="#187e71" stroke-width="3"/><text x="86" y="774" font-family="Apple SD Gothic Neo, sans-serif" font-size="26" fill="#187e71">배포 및 피드백 · 단계별 통과 후 진행</text><text x="86" y="811" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">현재: 로컬 도구·규칙 controller 검증 / 다음: 서버 모델 tool calling 실측</text><text x="86" y="842" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#152238">그다음: 실제 프로젝트 평가 → 승인된 실행 연결 → 사용자 피드백 → 조건부 LoRA</text></svg>