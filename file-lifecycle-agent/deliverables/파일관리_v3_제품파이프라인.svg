<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1380" viewBox="0 0 1500 1380"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="#8c9db8"/></marker></defs><rect width="1500" height="1380" rx="20" fill="#f5f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="43" font-size="15" fill="#4f46e5" font-weight="700">FILE LIFECYCLE AGENT · v3 · 2026.11.02 · 설계</text><text x="50" y="92" font-size="33" fill="#14213a" font-weight="800">파일을 작업에 연결하고, 필요한 관계를 보존하며 정리합니다</text><text x="50" y="128" font-size="18" fill="#64748b">S0 데이터 경계 → S1–S7 제품 처리 · 기존 모듈 재사용과 추가 구현 범위를 구분합니다.</text><rect x="440" y="180" width="640" height="110" rx="14" fill="white" stroke="#2563eb" stroke-width="1.5" /><rect x="456" y="198" width="4" height="74" rx="2" fill="#2563eb"/><text x="471" y="215" font-size="20" fill="#2563eb" font-weight="700">S1  수집·파일 식별</text><text x="471" y="245" font-size="16" fill="#475569">안정화 → 자료 ID / 해시 / 경로 이력</text><path d="M760 290 V313" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="320" width="640" height="110" rx="14" fill="white" stroke="#2563eb" stroke-width="1.5" /><rect x="456" y="338" width="4" height="74" rx="2" fill="#2563eb"/><text x="471" y="355" font-size="20" fill="#2563eb" font-weight="700">S2  내용·메타데이터 추출</text><text x="471" y="385" font-size="16" fill="#475569">PDF / OCR → 본문·페이지·좌표·추출 상태</text><path d="M760 430 V453" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="460" width="640" height="110" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="456" y="478" width="4" height="74" rx="2" fill="#047857"/><text x="471" y="495" font-size="20" fill="#047857" font-weight="700">S3  기존 작업·관련 파일 후보 검색</text><text x="471" y="525" font-size="16" fill="#475569">파일명 + 본문 + 허용 경로·프로젝트 문맥</text><path d="M760 570 V593" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="600" width="640" height="110" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="456" y="618" width="4" height="74" rx="2" fill="#047857"/><text x="471" y="635" font-size="20" fill="#047857" font-weight="700">S4  프로젝트 귀속·묶음·관계 제안</text><text x="471" y="665" font-size="16" fill="#475569">첨부 / 복사본 / 버전 후보 / 명시적 참조</text><path d="M760 710 V733" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="740" width="640" height="110" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="456" y="758" width="4" height="74" rx="2" fill="#047857"/><text x="471" y="775" font-size="20" fill="#047857" font-weight="700">S5  원문·식별자·참조 검증</text><text x="471" y="805" font-size="16" fill="#475569">허위 근거·없는 경로·충돌 → 확인 또는 보류</text><path d="M760 850 V873" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="880" width="640" height="110" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="456" y="898" width="4" height="74" rx="2" fill="#047857"/><text x="471" y="915" font-size="20" fill="#047857" font-weight="700">S6  상태·보관 정책 → 정리 계획</text><text x="471" y="945" font-size="16" fill="#475569">진행 / 완료 / 재개 + 공유 참조 → 유지·보관</text><path d="M760 990 V1013" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="440" y="1020" width="640" height="110" rx="14" fill="white" stroke="#2563eb" stroke-width="1.5" /><rect x="456" y="1038" width="4" height="74" rx="2" fill="#2563eb"/><text x="471" y="1055" font-size="20" fill="#2563eb" font-weight="700">S7  허용 정책에 따른 실행·복구</text><text x="471" y="1085" font-size="16" fill="#475569">묶음 확인 → 실행 직전 검사 → 이력·되돌리기</text><rect x="45" y="180" width="340" height="175" rx="14" fill="white" stroke="#2563eb" stroke-width="1.5" /><rect x="61" y="198" width="4" height="139" rx="2" fill="#2563eb"/><text x="76" y="215" font-size="20" fill="#2563eb" font-weight="700">S0  로컬 입력</text><text x="76" y="245" font-size="16" fill="#475569">허용한 다운로드·프로젝트 폴더</text><text x="76" y="270" font-size="16" fill="#475569">기존 폴더 / README / 승인 자료</text><text x="76" y="295" font-size="16" fill="#475569">개인 파일은 허용 범위만 읽기</text><path d="M385 267 H432" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="45" y="415" width="340" height="175" rx="14" fill="white" stroke="#7c3aed" stroke-width="1.5" /><rect x="61" y="433" width="4" height="139" rx="2" fill="#7c3aed"/><text x="76" y="450" font-size="20" fill="#7c3aed" font-weight="700">S0  HippoCamp 입력</text><text x="76" y="480" font-size="16" fill="#475569">선택 프로필의 원본 · 읽기 전용</text><text x="76" y="505" font-size="16" fill="#475569">작업은 별도 sandbox 복사본</text><text x="76" y="530" font-size="16" fill="#475569">QA 정답·Gold는 기본 입력 제외</text><path d="M385 502 H410 V235 H432" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="1130" y="180" width="325" height="175" rx="14" fill="white" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="1146" y="198" width="4" height="139" rx="2" fill="#d97706"/><text x="1161" y="215" font-size="20" fill="#d97706" font-weight="700">의미 추출기 · 선택</text><text x="1161" y="245" font-size="16" fill="#475569">로컬 규칙 또는 LLM 어댑터</text><text x="1161" y="270" font-size="16" fill="#475569">OpenAI 키는 서버 환경변수</text><text x="1161" y="295" font-size="16" fill="#475569">유료 실험은 아직 미실행</text><path d="M1130 267 H1110 V655 H1088" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="1130" y="415" width="325" height="175" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="1146" y="433" width="4" height="139" rx="2" fill="#047857"/><text x="1161" y="450" font-size="20" fill="#047857" font-weight="700">관계의 근거</text><text x="1161" y="480" font-size="16" fill="#475569">단순 유사도는 후보 신호</text><text x="1161" y="505" font-size="16" fill="#475569">명시적 ID / 경로 / 매니페스트</text><text x="1161" y="530" font-size="16" fill="#475569">확인된 관계와 추정을 분리</text><rect x="1130" y="650" width="325" height="175" rx="14" fill="white" stroke="#64748b" stroke-width="1.5" /><rect x="1146" y="668" width="4" height="139" rx="2" fill="#64748b"/><text x="1161" y="685" font-size="20" fill="#64748b" font-weight="700">모호하면 묶음 확인</text><text x="1161" y="715" font-size="16" fill="#475569">무조건 옮기지 않고 보류</text><text x="1161" y="740" font-size="16" fill="#475569">대표 질문 한 번으로 귀속 확인</text><text x="1161" y="765" font-size="16" fill="#475569">유지·거절 이력은 반복 억제</text><path d="M1130 735 H1105 V940 H1088" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="45" y="650" width="340" height="175" rx="14" fill="white" stroke="#64748b" stroke-width="1.5" /><rect x="61" y="668" width="4" height="139" rx="2" fill="#64748b"/><text x="76" y="685" font-size="20" fill="#64748b" font-weight="700">상태·보존 원칙</text><text x="76" y="715" font-size="16" fill="#475569">완료는 명시적 사용자 사건</text><text x="76" y="740" font-size="16" fill="#475569">날짜·파일 열기만으로 완료 금지</text><text x="76" y="765" font-size="16" fill="#475569">모델 가중치는 임의 로드 금지</text><rect x="45" y="885" width="340" height="175" rx="14" fill="white" stroke="#64748b" stroke-width="1.5" /><rect x="61" y="903" width="4" height="139" rx="2" fill="#64748b"/><text x="76" y="920" font-size="20" fill="#64748b" font-weight="700">이번 구현 범위</text><text x="76" y="950" font-size="16" fill="#475569">재사용: 로컬 감지·PDF/OCR</text><text x="76" y="975" font-size="16" fill="#475569">재사용: SQLite·단일 파일 undo</text><text x="76" y="1000" font-size="16" fill="#475569">추가: 프로젝트 검색·관계·계획</text><rect x="1130" y="885" width="325" height="175" rx="14" fill="white" stroke="#64748b" stroke-width="1.5" /><rect x="1146" y="903" width="4" height="139" rx="2" fill="#64748b"/><text x="1161" y="920" font-size="20" fill="#64748b" font-weight="700">현재 필수가 아닌 도구</text><text x="1161" y="950" font-size="16" fill="#475569">웹 크롤링 / 다중 에이전트</text><text x="1161" y="975" font-size="16" fill="#475569">전 디스크 감시 / 파인튜닝</text><text x="1161" y="1000" font-size="16" fill="#475569">원본 URL 감시는 별도 확장</text><rect x="45" y="1190" width="1410" height="105" rx="14" fill="white" stroke="#334155" stroke-width="1.5" /><rect x="61" y="1208" width="4" height="69" rx="2" fill="#334155"/><text x="76" y="1225" font-size="20" fill="#334155" font-weight="700">공유 기억 · SQLite</text><text x="76" y="1255" font-size="16" fill="#475569">자료 ID / 원본·현재 경로 / 추출·근거 / 프로젝트 / 관계 / 상태 사건 / 보관 정책 / 계획 / 실행 이력</text><text x="50" y="1342" font-size="17" fill="#64748b">파랑: 기존 모듈 재사용·확장   ·   초록: 추가 구현 설계   ·   보라: 평가 데이터   ·   도식은 전체 구현 완료를 뜻하지 않습니다.</text></g></svg>