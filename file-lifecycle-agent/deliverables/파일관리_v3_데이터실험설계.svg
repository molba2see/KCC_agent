<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="#8c9db8"/></marker></defs><rect width="1500" height="1100" rx="20" fill="#f5f7fb"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="50" y="43" font-size="15" fill="#4f46e5" font-weight="700">FILE LIFECYCLE AGENT · v3 · 2026.11.02 · 설계</text><text x="50" y="92" font-size="33" fill="#14213a" font-weight="800">HippoCamp는 검색·근거 평가에, 추가 시나리오는 정리·보존 평가에</text><text x="50" y="128" font-size="18" fill="#64748b">정답은 채점기에만 전달합니다. 모델 입력과 정답 저장소를 분리합니다.</text><rect x="50" y="180" width="650" height="140" rx="14" fill="white" stroke="#7c3aed" stroke-width="1.5" /><rect x="66" y="198" width="4" height="104" rx="2" fill="#7c3aed"/><text x="81" y="215" font-size="20" fill="#7c3aed" font-weight="700">평가 트랙 A · HippoCamp 원본</text><text x="81" y="245" font-size="16" fill="#475569">question + 허용된 원본·메타데이터만 Agent에 제공</text><text x="81" y="270" font-size="16" fill="#475569">raw 추출 / 검색 / 관계·근거 검증 → 답변·파일 ID</text><rect x="800" y="180" width="650" height="140" rx="14" fill="white" stroke="#dc2626" stroke-width="1.5" /><rect x="816" y="198" width="4" height="104" rx="2" fill="#dc2626"/><text x="831" y="215" font-size="20" fill="#dc2626" font-weight="700">채점기 전용 · 모델 입력 차단</text><text x="831" y="245" font-size="16" fill="#475569">answer / 정답 file_path / evidence / rationale</text><text x="831" y="270" font-size="16" fill="#475569">QAID·QANum 연결 열 → 인덱스에서 제거</text><rect x="50" y="380" width="650" height="165" rx="14" fill="white" stroke="#7c3aed" stroke-width="1.5" /><rect x="66" y="398" width="4" height="129" rx="2" fill="#7c3aed"/><text x="81" y="415" font-size="20" fill="#7c3aed" font-weight="700">E0–E3  읽기·검색·연결을 분리해서 평가</text><text x="81" y="445" font-size="16" fill="#475569">E0 경로·형식·데이터 누수 점검</text><text x="81" y="470" font-size="16" fill="#475569">E1 raw 추출 vs Gold-text 보조 조건</text><text x="81" y="495" font-size="16" fill="#475569">E2 검색 기준선 / E3 관계·프로젝트 추가 라벨</text><rect x="800" y="380" width="650" height="165" rx="14" fill="white" stroke="#dc2626" stroke-width="1.5" /><rect x="816" y="398" width="4" height="129" rx="2" fill="#dc2626"/><text x="831" y="415" font-size="20" fill="#dc2626" font-weight="700">검색·근거 지표</text><text x="831" y="445" font-size="16" fill="#475569">Recall@k / MRR / 정답 파일 집합 회수</text><text x="831" y="470" font-size="16" fill="#475569">인용·경로 검증 / 잘못된 귀속 / 처리 coverage</text><text x="831" y="495" font-size="16" fill="#475569">Gold 텍스트는 별도 조건, 공식 raw 점수와 구분</text><path d="M375 320 V373" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><path d="M1125 320 V373" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><path d="M700 462 H792" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="50" y="610" width="650" height="165" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="66" y="628" width="4" height="129" rx="2" fill="#047857"/><text x="81" y="645" font-size="20" fill="#047857" font-weight="700">평가 트랙 B · 직접 작성하는 사건·정답</text><text x="81" y="675" font-size="16" fill="#475569">파일 유입 → 다른 버전 → 작업 완료 → 재개</text><text x="81" y="700" font-size="16" fill="#475569">허용 목적지 / 관계 / 유지·보관 / 사용자 확인</text><text x="81" y="725" font-size="16" fill="#475569">데이콘 가중치·코드는 작은 묶음의 확장 사례</text><rect x="800" y="610" width="650" height="165" rx="14" fill="white" stroke="#047857" stroke-width="1.5" /><rect x="816" y="628" width="4" height="129" rx="2" fill="#047857"/><text x="831" y="645" font-size="20" fill="#047857" font-weight="700">E4–E7  복사본 sandbox 실행 평가</text><text x="831" y="675" font-size="16" fill="#475569">E4 정리 후 작업 유지 / E5 라이프사이클</text><text x="831" y="700" font-size="16" fill="#475569">E6 충돌·중단·복구 / E7 모델 파일 묶음 보호</text><text x="831" y="725" font-size="16" fill="#475569">원본·필수 참조 보존 + 사용자 부담 + 자동 처리율</text><path d="M700 692 H792" fill="none" stroke="#8c9db8" stroke-width="2" marker-end="url(#a)" /><rect x="50" y="850" width="1400" height="145" rx="14" fill="white" stroke="#334155" stroke-width="1.5" /><rect x="66" y="868" width="4" height="109" rx="2" fill="#334155"/><text x="81" y="885" font-size="20" fill="#334155" font-weight="700">먼저 할 일과 결과 해석</text><text x="81" y="915" font-size="16" fill="#475569">① E0 매핑·원본 판독 확인 → ② E2 파일명/BM25 → ③ E1 추출 한계 분리 → ④ E3–E5 묶음·상태 효과</text><text x="81" y="940" font-size="16" fill="#475569">subset 주석 56문항 중 PDF·일반 이미지 형식 후보 19개 확인. 모델 성능은 아직 측정하지 않았습니다.</text><text x="81" y="965" font-size="16" fill="#475569">HippoCamp의 QA 동시 근거를 같은 프로젝트·버전 정답으로 간주하지 않습니다. 정리·보존 라벨은 별도 작성합니다.</text></g></svg>