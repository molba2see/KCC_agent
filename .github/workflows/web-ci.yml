name: Web and API checks
on:
  push:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/dist/app.js && node --check web/dist/agent.js && node --check web/dist/setup.js && node --check web/dist/cloud.js && node --check web/dist/onboarding.js && node --check web/dist/workspace-policy.js
      - run: python -m unittest discover -s web/local -p 'test_*.py'
      - run: python -m unittest discover -s web/bridge
      - run: python -m pip install -r web/backend/requirements.txt
      - run: python web/backend/manage.py test library
        env:
          MOA_DJANGO_SECRET_KEY: ci-only-secret
